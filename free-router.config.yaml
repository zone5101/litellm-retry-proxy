    model_info: { max_input_tokens: 65536, max_output_tokens: 65536 }

litellm_settings:
  request_timeout: 600
  drop_params: true
  callbacks: free_router_autoroute.autorouter # hook auto-route: agent-auto -> fast/strong/omni/small theo context # model khong hieu param (reasoning_effort...) thi bo qua, khong fail

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  allowed_fails: 2 # deployment fail 2 lan/phut -> cooldown
  cooldown_time: 90 # cho ~ Retry-After cua NIM
  timeout: 600
  retry_policy:
    RateLimitErrorRetries: 0 # 429: KHONG ngu Retry-After - cooldown ngay roi nhay order sau
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
    NotFoundErrorRetries: 0
    DefaultRetries: 2
  context_window_fallbacks: # input vuot context chuoi hien tai -> nhay chuoi 1M
    - agent-fast: [agent-strong]
    - free-small: [agent-fast]
  optional_pre_call_checks: # ghim 1 conversation vao 1 deployment (xuyen suot ngu canh)
    - session_affinity
  deployment_affinity_ttl_seconds: 3600

general_settings:
  dangerously_permit_weak_or_unset_master_key: true # localhost-only (127.0.0.1), may ca nhan - harden sau neu can
