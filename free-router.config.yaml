    model_info: { max_input_tokens: 131072, max_output_tokens: 131072 }
  - model_name: agent-strong
    order: 3
    litellm_params: { model: openai/nvidia/nemotron-3-ultra-550b-a55b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 131072, max_output_tokens: 131072 }
  - model_name: agent-strong
    order: 4
    litellm_params: { model: openai/nemotron-3-ultra, api_base: https://ollama.com/v1, api_key: os.environ/OLLAMA_API_KEY }
    model_info: { max_input_tokens: 246144, max_output_tokens: 16384 }
  # ---------- CHUOI 3: agent-omni (a phuong tien: anh/audio) ----------
  - model_name: agent-omni
