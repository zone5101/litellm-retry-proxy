# Free Router - LiteLLM proxy cho Copilot Chat/Autopilot (13 model free, 4 chuoi auto-switch)
# Doc: MAINTENANCE.md muc 11. Start: start-free-router.ps1 (port 4000, chi 127.0.0.1, khong can key)
# Co che: moi model ao = 1 chuoi deployment theo `order`. Request fail o order N (429/5xx/timeout)
# -> deployment bi cooldown ngay -> router tu nhay order N+1 trong CUNG request. Het cooldown tu ve N.
# glm-5.3-flash ang can budget van giu order 1 cua agent-fast: router se cooldown va nhay tiep,
# khi NIM hoi budget thi tu quay lai (ung yeu cau "cu cho no vao").
model_list:
  # ---------- CHUOI 1: agent-fast (Autopilot/chat hang ngay) ----------
  - model_name: agent-fast
    order: 1
    litellm_params: { model: openai/z-ai/glm-5.3-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 1044480, max_output_tokens: 262144 }
  - model_name: agent-fast
    order: 2
    litellm_params: { model: openai/deepseek-ai/deepseek-v4.1-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 1044480, max_output_tokens: 262144 }
  - model_name: agent-fast
    order: 3
    litellm_params: { model: openai/nvidia/nemotron-3.5-lightning-30b-a3b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 131072, max_output_tokens: 131072 }
  - model_name: agent-fast
    order: 4 # storm-breaker: pool Ollama Cloud rieng, khong dinh 429 cua account NIM
    litellm_params: { model: openai/gpt-oss:120b, api_base: https://ollama.com/v1, api_key: os.environ/OLLAMA_API_KEY }
    model_info: { max_input_tokens: 114688, max_output_tokens: 16384 }
  # ---------- CUA VAO DUY NHAT: agent-auto ----------
  # User chi can chon model nay; hook free_router_autoroute phan loai roi dieu vao 4 chuoi.
  # Neu hook loi, agent-auto van co chuoi rieng (nhu agent-fast) de khong bao gio chet.
  - model_name: agent-auto
    order: 1
    litellm_params: { model: openai/z-ai/glm-5.3-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 1044480, max_output_tokens: 262144 }
  - model_name: agent-auto
    order: 2
    litellm_params: { model: openai/deepseek-ai/deepseek-v4.1-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 1044480, max_output_tokens: 262144 }
  - model_name: agent-auto
    order: 3
    litellm_params: { model: openai/nvidia/nemotron-3.5-lightning-30b-a3b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
    model_info: { max_input_tokens: 131072, max_output_tokens: 131072 }
  - model_name: agent-auto
    order: 4
    litellm_params: { model: openai/gpt-oss:120b, api_base: https://ollama.com/v1, api_key: os.environ/OLLAMA_API_KEY }
    model_info: { max_input_tokens: 114688, max_output_tokens: 16384 }
  # ---------- CHUOI 2: agent-strong (viec kho, chuoi dai) ----------
  - model_name: agent-strong
    order: 1
    litellm_params: { model: openai/z-ai/glm-5.3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY }
